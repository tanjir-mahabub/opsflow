services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: opsflow
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports: ["5432:5432"]
    volumes: [opsflow_data:/var/lib/postgresql/data]
  api:
    build: ./backend
    env_file: ./backend/.env
    ports: ["8000:8000"]
    depends_on: [db]
volumes:
  opsflow_data:
